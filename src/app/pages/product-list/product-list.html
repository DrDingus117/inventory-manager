<h1>📦 Inventory List</h1>

<p>Total Products: {{ products.length }}</p>

<button routerLink="/">
  🏠 Home
</button>

<button routerLink="/products/new">
  ➕ Add Product
</button>

<br />
<br />

<table border="1" cellpadding="8">
  <thead>
    <tr>
      <th>ID</th>
      <th>Product Name</th>
      <th>Price</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>
    @for (product of products; track product.id) {
      <tr>
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>${{ product.data?.price ?? 0 }}</td>
        <td>
          <button [routerLink]="['/products/edit', product.id]">
            ✏️ Edit
          </button>

          <button (click)="deleteProduct(product.id!)">
            🗑️ Delete
          </button>
        </td>
      </tr>
    }
  </tbody>
</table>
